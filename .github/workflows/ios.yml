name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode* || true
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selected Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos
          xcrun --show-sdk-version --sdk iphoneos
          xcrun --show-sdk-version --sdk iphonesimulator

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Inspect SDK & Generate Xcode Project
        run: |
          SDK_VERSION=$(xcrun --show-sdk-version --sdk iphoneos)
          echo "Installed iOS SDK version: $SDK_VERSION"
          
          # Check if SDK MaxDeploymentTarget needs to accept 27.0
          # We can check the SDK settings file:
          SDK_PATH=$(xcrun --show-sdk-path --sdk iphoneos)
          SIM_SDK_PATH=$(xcrun --show-sdk-path --sdk iphonesimulator)
          echo "Device SDK path: $SDK_PATH"
          echo "Simulator SDK path: $SIM_SDK_PATH"
          
          # Generate Xcode project from project.yml
          xcodegen generate

      - name: Set up iPhone 17 Simulator
        run: |
          echo "Configuring simulator..."
          xcrun simctl list devicetypes | grep -i "iPhone" || true
          # If iPhone 17 simulator does not exist, create it matching 393x852 pt
          if ! xcrun simctl list devices available | grep -q "iPhone 17"; then
            echo "Creating iPhone 17 simulator..."
            RUNTIME_ID=$(xcrun simctl list runtimes | grep -i "iOS" | tail -1 | awk '{print $NF}')
            xcrun simctl create "iPhone 17" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME_ID" || true
          fi
          xcrun simctl list devices available | grep "iPhone 17" || true

      - name: Run Tests & Capture Snapshots
        run: |
          mkdir -p screenshots
          xcodebuild test \
            -scheme Still \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Build Archive (Generic iOS Device)
        run: |
          xcodebuild \
            -scheme Still \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Still.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package Unsigned .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/Still.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r Still.ipa Payload
          cd ..
          ls -lh build/Still.ipa

      - name: Collect Screenshots
        if: always()
        run: |
          if [ -d "build/DerivedData" ]; then
            find build/DerivedData -name "*.png" -exec cp {} screenshots/ \; 2>/dev/null || true
          fi
          echo "Screenshots in screenshots/:"
          ls -la screenshots/ || true

      - name: Upload Still.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Still-ipa
          path: build/Still.ipa
          if-no-files-found: error

      - name: Upload Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Still-screenshots
          path: screenshots/
          if-no-files-found: warn
