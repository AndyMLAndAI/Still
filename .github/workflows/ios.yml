name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode* || true
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selected Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos
          xcrun --show-sdk-version --sdk iphoneos
          xcrun --show-sdk-version --sdk iphonesimulator

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Inspect SDK & Generate Xcode Project
        run: |
          SDK_VERSION=$(xcrun --show-sdk-version --sdk iphoneos)
          echo "Installed iOS SDK version: $SDK_VERSION"
          
          # Per references/build-pipeline.md open question 2:
          # Check whether runner image has iOS 27 SDK; if not, build against newest available SDK.
          if [ "$SDK_VERSION" != "27.0" ]; then
            echo "Notice: iOS 27 SDK is not available in the runner image (current is $SDK_VERSION)."
            echo "Adapting project target to newest available SDK $SDK_VERSION..."
            sed -i '' "s/27.0/$SDK_VERSION/g" project.yml Still/project.yml
          fi
          
          xcodegen generate

      - name: Boot iPhone 17 Simulator
        run: |
          xcrun simctl list devices available | grep -i "iPhone"
          SIM_ID=$(xcrun simctl list devices available | grep "iPhone 17 (" | head -n 1 | awk -F '[()]' '{print $2}')
          if [ -z "$SIM_ID" ]; then
            SIM_ID=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | awk -F '[()]' '{print $2}')
          fi
          echo "Selected Simulator ID: $SIM_ID"
          echo "SIM_ID=$SIM_ID" >> $GITHUB_ENV
          
          echo "Booting simulator $SIM_ID..."
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          echo "Simulator booted successfully."

      - name: Run Tests & Capture Snapshots
        run: |
          mkdir -p screenshots
          mkdir -p /tmp/screenshots
          xcodebuild test \
            -scheme Still \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -destination-timeout 60 \
            -parallel-testing-enabled NO \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Build Archive (Generic iOS Device)
        run: |
          xcodebuild \
            -scheme Still \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Still.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package Unsigned .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/Still.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r Still.ipa Payload
          cd ..
          ls -lh build/Still.ipa

      - name: Collect Screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d "/tmp/screenshots" ]; then
            cp -R /tmp/screenshots/* screenshots/ 2>/dev/null || true
          fi
          if [ -d "build/DerivedData" ]; then
            find build/DerivedData -name "*.png" -exec cp {} screenshots/ \; 2>/dev/null || true
          fi
          echo "Screenshots in screenshots/:"
          ls -la screenshots/ || true

      - name: Upload Still.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Still-ipa
          path: build/Still.ipa
          if-no-files-found: error

      - name: Upload Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Still-screenshots
          path: screenshots/
          if-no-files-found: warn
