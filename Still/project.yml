name: Still
options:
  bundleIdPrefix: com.andymlandai
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Still:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: .
    settings:
      base:
        PRODUCT_NAME: Still
        PRODUCT_BUNDLE_IDENTIFIER: com.andymlandai.still
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
  StillTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: ../StillTests
    dependencies:
      - target: Still
    settings:
      base:
        PRODUCT_NAME: StillTests
        PRODUCT_BUNDLE_IDENTIFIER: com.andymlandai.still.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
